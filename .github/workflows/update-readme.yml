name: Auto Update Projects in README

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Latest Repositories and Update README
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Fetch public repositories owned by user, sorted by most recently pushed/active
            const { data: repos } = await github.rest.repos.listForUser({
              username: 'alfrusmi-tech',
              sort: 'pushed',
              direction: 'desc',
              per_page: 20,
              type: 'owner'
            });

            // Filter out profile repository itself and any forks
            const validRepos = repos
              .filter(r => r.name.toLowerCase() !== 'alfrusmi-tech' && !r.fork)
              .slice(0, 4);

            if (validRepos.length === 0) {
              console.log('No valid repositories found.');
              return;
            }

            // Generate clean modern 2x2 grid table
            let table = '<table>\n';
            for (let i = 0; i < validRepos.length; i += 2) {
              table += '  <tr>\n';
              for (let j = 0; j < 2; j++) {
                const r = validRepos[i + j];
                if (r) {
                  const desc = r.description ? r.description.trim() : 'Explore project source code and implementation.';
                  const lang = r.language ? `<code>${r.language}</code>` : '<code>Code</code>';
                  const stars = r.stargazers_count > 0 ? ` · ⭐ ${r.stargazers_count}` : '';
                  const forks = r.forks_count > 0 ? ` · 🍴 ${r.forks_count}` : '';

                  table += '    <td width="50%" valign="top">\n';
                  table += `      <h4><a href="${r.html_url}">🚀 ${r.name} ↗</a></h4>\n`;
                  table += `      <p>${desc}</p>\n`;
                  table += `      ${lang}${stars}${forks}\n`;
                  table += '    </td>\n';
                }
              }
              table += '  </tr>\n';
            }
            table += '</table>';

            // Read README.md and replace content between markers
            let readme = fs.readFileSync('README.md', 'utf8');
            const markerRegex = /<!-- RECENT_REPOS:START -->[\s\S]*?<!-- RECENT_REPOS:END -->/;

            if (markerRegex.test(readme)) {
              readme = readme.replace(markerRegex, `<!-- RECENT_REPOS:START -->\n${table}\n<!-- RECENT_REPOS:END -->`);
              fs.writeFileSync('README.md', readme);
              console.log('Successfully updated README.md with latest projects!');
            } else {
              console.log('Markers <!-- RECENT_REPOS:START --> and <!-- RECENT_REPOS:END --> not found.');
            }

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update recent projects in README"
            git push
          else
            echo "No changes in repositories detected."
          fi
