<svg width="100%" height="180" viewBox="0 0 850 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Rect with Rounded Corners -->
  <rect width="850" height="180" rx="16" fill="url(#headerGrad)" />

  <!-- Decorative Wave 1 -->
  <path d="M0,130 C200,100 350,170 550,120 C700,85 780,140 850,110 L850,180 L0,180 Z" fill="url(#waveGrad)" />

  <!-- Decorative Wave 2 -->
  <path d="M0,150 C250,130 400,180 600,140 C720,115 800,160 850,145 L850,180 L0,180 Z" fill="#ffffff" fill-opacity="0.1" />

  <!-- Floating Ambient Circles -->
  <circle cx="80" cy="40" r="28" fill="#ffffff" fill-opacity="0.06" />
  <circle cx="780" cy="50" r="35" fill="#ffffff" fill-opacity="0.06" />
  <circle cx="730" cy="120" r="16" fill="#ffffff" fill-opacity="0.08" />

  <!-- Header Title -->
  <g filter="url(#dropShadow)">
    <text x="425" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff" letter-spacing="0.5">
      Hi there, I'm Fathima Rusmi 👋
    </text>
    <text x="425" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#e6fffa" letter-spacing="1">
      ENGINEERING UNDERGRADUATE &amp; FULL-STACK DEVELOPER
    </text>
  </g>
</svg>
